production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  journal_verification:
    class: JournalVerificationJob
    schedule: every day at 03:30 Asia/Tokyo
  cleanup:
    class: CleanupJob
    schedule: every day at 04:30 Asia/Tokyo
  scheduled_product_changes:
    class: ScheduledProductChangesJob
    schedule: every day at 00:01 Asia/Tokyo
