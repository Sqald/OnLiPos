services:
  # rails/worker が同時に起動して db:prepare (CREATE DATABASE) を競合実行すると
  # PG::UniqueViolation でクラッシュすることがあるため、DB準備はここで一度だけ行う
  db-prepare:
    build:
      context: ./onlipos/
    entrypoint: [ "bin/rails" ]
    command: [ "db:prepare" ]
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy

  rails:
    build:
      context: ./onlipos/
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      HOST_NAME: ${HOST_NAME:-}
      FORCE_SSL: ${FORCE_SSL:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALLOW_LEGACY_OPERATOR_AUTH: ${ALLOW_LEGACY_OPERATOR_AUTH:-}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-}
    volumes:
      # 商品画像などの添付ファイル（rails と worker で共有）
      - storage:/rails/storage
    secrets:
      - db_password
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:${POSTGRES_DOCKER_VERSION}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres:/var/lib/postgresql/
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx/
      args:
        - NGINX_DOCKER_VERSION=${NGINX_DOCKER_VERSION}
    volumes:
      - ./nginx/ssl:/ssl
      - ./onlipos/public:/rails/public:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      - postgres
      - rails
    restart: unless-stopped

  # DBのバックアップ（内容の確認・暗号化・通知つき）。設定は backup/backup.sh の冒頭を参照
  backup:
    image: postgres:${POSTGRES_DOCKER_VERSION}
    entrypoint: [ "/bin/sh", "/scripts/backup.sh" ]
    environment:
      DB_USER: ${DB_USER}
      # production.primary のDB名（config/database.yml）と一致させること
      BACKUP_DB: ${DB_NAME}_prod
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
    volumes:
      - ./backups:/backup
      - ./backup:/scripts:ro
      - storage:/storage:ro
      # secrets/backup_passphrase.txt を置くと暗号化する（任意。パスフレーズはサーバーとは別の場所にも必ず控えること）
      - ./secrets:/run/backup-secrets:ro
      # 2か所目の保存先。NAS等のマウント先を BACKUP_OFFSITE_HOST_DIR に指定し、BACKUP_OFFSITE_DIR=/offsite とする
      - ${BACKUP_OFFSITE_HOST_DIR:-./backups}:/offsite
    secrets:
      - db_password
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    # 48時間以内に成功していなければ unhealthy
    healthcheck:
      test: [ "CMD-SHELL", "test -f /backup/LAST_SUCCESS && [ $$(( $$(date +%s) - $$(cat /backup/LAST_SUCCESS) )) -lt 172800 ]" ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    restart: unless-stopped

  worker:
    build:
      context: ./onlipos/
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      HOST_NAME: ${HOST_NAME:-}
      FORCE_SSL: ${FORCE_SSL:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALLOW_LEGACY_OPERATOR_AUTH: ${ALLOW_LEGACY_OPERATOR_AUTH:-}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-}
    volumes:
      # 商品画像などの添付ファイル（rails と worker で共有）
      - storage:/rails/storage
    secrets:
      - db_password
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    command: bin/jobs
    restart: unless-stopped

volumes:
  postgres:
  storage:

secrets:
  db_password:
    file: ./secrets/db_password.txt
