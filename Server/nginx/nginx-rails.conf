# Cloudflare の実クライアントIPを $remote_addr として扱う
# IPv4: https://www.cloudflare.com/ips-v4
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
# IPv6: https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/ssl_settings.generated;

    # rails コンテナの宛先は Docker 内部DNS で都度解決する。
    # proxy_pass にホスト名を直接書くと nginx 起動時の IP に固定され、rails コンテナを
    # 作り直して IP が変わると「Connection refused」で全リクエストが 502 になるため。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rails_upstream http://rails:3000;

    # Serve precompiled assets directly if present on the host mount;
    # otherwise fall back to Rails (assets are baked into the GHCR image)
    location /assets/ {
        root /rails/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        try_files $uri @rails;
    }

    location / {
        proxy_pass $rails_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rails {
        proxy_pass $rails_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}