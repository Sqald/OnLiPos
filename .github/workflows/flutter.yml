name: Flutter CI

on:
  push:
    paths:
      - "Client/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "Client/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build_apk:
    name: Build APK (release)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ランナー既定のJDK（ubuntu-latest=26.04 では 25）は Gradle 8.14 が未対応のため、
      # android/app/build.gradle.kts の設定に合わせて JDK 17 を使う
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      # 署名鍵（Secrets）が登録されていれば正式な鍵で署名する。未登録の場合はデバッグ鍵での署名になる
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES が未登録のため、デバッグ鍵で署名します（配布・更新には使えません）"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: Client/onlipos/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build_windows:
    name: Build Windows (zip)
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip release bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath onlipos-windows-x64.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onlipos-windows-x64
          path: Client/onlipos/onlipos-windows-x64.zip
          retention-days: 7

  build_macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app onlipos-macos.zip

      - name: Upload .app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onlipos-macos
          path: Client/onlipos/build/macos/Build/Products/Release/onlipos-macos.zip
          retention-days: 7

  build_linux:
    name: Build Linux (tar.gz)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Archive bundle
        run: tar -czf onlipos-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onlipos-linux-x64
          path: Client/onlipos/onlipos-linux-x64.tar.gz
          retention-days: 7

  publish_latest:
    name: Publish latest release
    runs-on: ubuntu-latest
    needs: [build_apk, build_windows, build_macos, build_linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release_files
          find dist -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: Re-create latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest release_files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "main の最新コミット ${GITHUB_SHA} から自動ビルド。タグを切った正式リリースではなく、pushのたびに中身が差し替わるローリングビルドです。" \
            --target "$GITHUB_SHA"
