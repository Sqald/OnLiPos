name: Flutter CI

on:
  push:
    paths:
      - "Client/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "Client/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

jobs:
  test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build_apk:
    name: Build APK (release)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Client/onlipos/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build_windows:
    name: Build Windows (zip)
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip release bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath onlipos-windows-x64.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: onlipos-windows-x64
          path: Client/onlipos/onlipos-windows-x64.zip
          retention-days: 7

  build_macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app onlipos-macos.zip

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: onlipos-macos
          path: Client/onlipos/build/macos/Build/Products/Release/onlipos-macos.zip
          retention-days: 7

  build_linux:
    name: Build Linux (tar.gz)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Client/onlipos

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Archive bundle
        run: tar -czf onlipos-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: onlipos-linux-x64
          path: Client/onlipos/onlipos-linux-x64.tar.gz
          retention-days: 7

  publish_latest:
    name: Publish latest release
    runs-on: ubuntu-latest
    needs: [build_apk, build_windows, build_macos, build_linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release_files
          find dist -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: Re-create latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest release_files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "main の最新コミット ${GITHUB_SHA} から自動ビルド。タグを切った正式リリースではなく、pushのたびに中身が差し替わるローリングビルドです。" \
            --target "$GITHUB_SHA"
